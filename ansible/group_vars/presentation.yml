---
presentation_user: webapp
presentation_home: /home/webapp
presentation_app_dir: "{{ presentation_home }}/esteira-geo"

# Dependências web do sistema
web_packages:
  - python3.12-dev
  - python3.12-venv
  - nginx
  - postgresql-client
  - git
  - supervisor

# Pacotes Python para Flask
presentation_pip_packages:
  - flask>=2.0.0
  - psycopg2-binary>=2.9.0
  - boto3>=1.28.0
  - python-dotenv>=1.0.0
  - gunicorn>=20.1.0
  - flask-cors>=4.0.0
  - geopandas>=0.13.0
  - shapely>=2.0.0
  - pandas>=2.0.0
  - pyarrow>=12.0.0

# Configuração Nginx
nginx_server_name: "_"
nginx_upstream_server: "127.0.0.1:{{ flask_port | default(5000) }}"

# Configuração Supervisor para Gunicorn
supervisor_program_name: "esteira_geo_flask"
gunicorn_workers: 4
gunicorn_threads: 2
gunicorn_worker_class: "sync"

# Flask
flask_env: production
