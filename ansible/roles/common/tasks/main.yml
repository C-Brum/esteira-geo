---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install system packages
  apt:
    name: "{{ system_packages | default([]) }}"
    state: present

- name: Install Python 3.12 and build tools
  apt:
    name:
      - python3.12
      - python3.12-venv
      - python3.12-dev
      - python3-pip
      - gcc
      - g++
      - make
      - curl
      - git
      - wget
      - htop
      - jq
    state: present

- name: Set python3 to point to python3.12
  alternatives:
    name: python3
    link: /usr/bin/python3
    path: /usr/bin/python3.12
    priority: 100
