services:
  # PostgreSQL com PostGIS
  postgis:
    image: postgis/postgis:13-3.2
    container_name: esteira-postgis
    environment:
      POSTGRES_USER: esteira_user
      POSTGRES_PASSWORD: esteira_local_2025
      POSTGRES_DB: esteira_geo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pipeline/postgis_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - esteira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esteira_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO para simular S3/OBS
  minio:
    image: minio/minio:latest
    container_name: esteira-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - esteira-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Pipeline ETL
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: esteira-pipeline
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_BRONZE_BUCKET: bronze
      AWS_S3_SILVER_BUCKET: silver
      AWS_S3_GOLD_BUCKET: gold
      RDS_HOST: postgis
      RDS_PORT: 5432
      RDS_NAME: esteira_geo
      RDS_USER: esteira_user
      RDS_PASSWORD: esteira_local_2025
      USE_CASE: enchentes_poa
      PYTHONUNBUFFERED: 1
    volumes:
      - ./pipeline/data:/app/data
      - ./data/bronze:/data/bronze
      - pipeline_silver:/data/silver
      - pipeline_gold:/data/gold
    networks:
      - esteira-network
    command: tail -f /dev/null  # Fica awake para testes manuais

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: pipeline/Dockerfile.web
    container_name: esteira-web
    depends_on:
      postgis:
        condition: service_healthy
      pipeline:
        condition: service_started
    environment:
      RDS_HOST: postgis
      RDS_PORT: 5432
      RDS_NAME: esteira_geo
      RDS_USER: esteira_user
      RDS_PASSWORD: esteira_local_2025
      USE_CASE: enchentes_poa
      FLASK_ENV: development
      FLASK_APP: app.py
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    volumes:
      - ./pipeline/web/app.py:/app/app.py
      - ./pipeline/web/templates:/app/templates
      - ./logs/flask:/app/logs
    networks:
      - esteira-network
    command: python app.py

  # JupyterLab — processamento interativo com acesso à esteira
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: esteira-jupyter
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_BRONZE_BUCKET: bronze
      AWS_S3_SILVER_BUCKET: silver
      AWS_S3_GOLD_BUCKET: gold
      RDS_HOST: postgis
      RDS_PORT: 5432
      RDS_NAME: esteira_geo
      RDS_USER: esteira_user
      RDS_PASSWORD: esteira_local_2025
      USE_CASE: enchentes_poa
      PYTHONUNBUFFERED: 1
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/notebooks
      - ./pipeline:/app/pipeline_src
      - ./data/bronze:/data/bronze
      - pipeline_silver:/data/silver
      - pipeline_gold:/data/gold
    networks:
      - esteira-network

  # Watcher: substituído pelo Airflow — mantido como fallback para uso sem Airflow
  pipeline-watcher:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: esteira-pipeline-watcher
    depends_on:
      pipeline:
        condition: service_started
    environment:
      POLL_INTERVAL: 10
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_BRONZE_BUCKET: bronze
      AWS_S3_SILVER_BUCKET: silver
      AWS_S3_GOLD_BUCKET: gold
      RDS_HOST: postgis
      RDS_PORT: 5432
      RDS_NAME: esteira_geo
      RDS_USER: esteira_user
      RDS_PASSWORD: esteira_local_2025
      PYTHONUNBUFFERED: 1
    volumes:
      - ./pipeline/data:/app/data
      - pipeline_silver:/data/silver
      - pipeline_gold:/data/gold
    networks:
      - esteira-network
    restart: unless-stopped
    profiles:
      - watcher   # só sobe com: docker compose --profile watcher up
    command: ["python", "/app/watchers/watch_bronze.py"]

  # ── Airflow ────────────────────────────────────────────────────────────────

  # Inicializa DB do Airflow e cria usuário admin (roda uma vez e sai)
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: esteira-airflow-init
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://esteira_user:esteira_local_2025@postgis:5432/esteira_geo
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "esteira-geo-secret"
    networks:
      - esteira-network
    entrypoint: ["/bin/bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@esteira.local || true"]
    restart: "no"

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: esteira-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://esteira_user:esteira_local_2025@postgis:5432/esteira_geo
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "esteira-geo-secret"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Retenção de histórico: limpa runs com mais de 30 dias
      AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_CREATE_PER_LOOP: "10"
      AIRFLOW__SCHEDULER__CLEAN_TIS_WITHOUT_DAGRUN: "true"
      AIRFLOW__DB__MAX_DB_RETRIES: "3"
      AIRFLOW_CONN_S3_ESTEIRA: '{"conn_type": "aws", "login": "minioadmin", "password": "minioadmin123", "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}'
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_BRONZE_BUCKET: bronze
      AWS_S3_SILVER_BUCKET: silver
      AWS_S3_GOLD_BUCKET: gold
      RDS_HOST: postgis
      RDS_PORT: 5432
      RDS_NAME: esteira_geo
      RDS_USER: esteira_user
      RDS_PASSWORD: esteira_local_2025
      USE_CASE: enchentes_poa
      PYTHONPATH: /opt/airflow/pipeline
      LOG_FILE: /tmp/pipeline.log
      LOCAL_BRONZE_PATH: /tmp/bronze
      LOCAL_SILVER_PATH: /tmp/silver
      LOCAL_GOLD_PATH: /tmp/gold
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./pipeline/etl:/opt/airflow/pipeline/etl
      - ./pipeline/config.py:/opt/airflow/pipeline/config.py
    networks:
      - esteira-network
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: esteira-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://esteira_user:esteira_local_2025@postgis:5432/esteira_geo
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
      AIRFLOW__WEBSERVER__SECRET_KEY: "esteira-geo-secret"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    networks:
      - esteira-network
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pipeline_silver:
    driver: local
  pipeline_gold:
    driver: local

networks:
  esteira-network:
    driver: bridge
